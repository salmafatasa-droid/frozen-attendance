
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frozen Attendance Scanner</title>

  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #eaf6ff;
      background:
        radial-gradient(circle at top, #183d60, transparent 55%),
        linear-gradient(145deg, #030914, #07182b);
    }

    .scanner-card {
      width: 100%;
      max-width: 460px;
      padding: 22px;
      border: 1px solid #315d80;
      border-radius: 24px;
      background: rgba(8, 26, 46, .96);
      box-shadow: 0 18px 55px #0008;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      color: #bceaff;
      font-size: 25px;
      letter-spacing: 2px;
    }

    .header p {
      color: #9bbbd3;
      font-size: 13px;
    }

    .camera-box {
      overflow: hidden;
      border: 2px solid #70cfff;
      border-radius: 18px;
      background: #000;
      aspect-ratio: 4 / 5;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-line {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 50%;
      height: 2px;
      background: #8de1ff;
      box-shadow: 0 0 12px #8de1ff;
      pointer-events: none;
    }

    .status {
      margin: 16px 0;
      min-height: 42px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
      color: #c9eaff;
      background: #102c46;
    }

    .buttons {
      display: grid;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      color: #06213a;
      background: linear-gradient(135deg, #bceaff, #62c9ff);
    }

    #nextButton {
      color: #dff5ff;
      background: #234967;
      display: none;
    }

    #closeButton {
      color: #d5e9f8;
      background: #172c40;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: #789ab5;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="scanner-card">
    <header class="header">
      <h1>FROZEN SCANNER</h1>
      <p>QR Attendance System</p>
    </header>

    <div class="camera-box">
      <video id="video" autoplay muted playsinline></video>
      <div class="scan-line"></div>
    </div>

    <div class="status" id="status">
      Tekan tombol MULAI KAMERA untuk memulai pemindaian.
    </div>

    <div class="buttons">
      <button id="startButton" type="button">
        MULAI KAMERA
      </button>

      <button id="nextButton" type="button">
        SCAN BERIKUTNYA
      </button>

      <button id="closeButton" type="button">
        TUTUP SCANNER
      </button>
    </div>

    <div class="footer">
      SMAN 2 PAYAKUMBUH · FROZEN ATTENDANCE
    </div>
  </main>

  <script>
    const video = document.getElementById('video');
    const statusBox = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const nextButton = document.getElementById('nextButton');
    const closeButton = document.getElementById('closeButton');

    let reader = null;
    let controls = null;
    let scanning = false;
    let sending = false;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function stopCamera() {
      scanning = false;

      if (controls) {
        try {
          controls.stop();
        } catch (error) {}
        controls = null;
      }

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
    }

    async function startCamera() {
      if (scanning) return;

      if (!window.opener || window.opener.closed) {
        setStatus(
          'Website utama tidak ditemukan. Buka scanner melalui tombol scanner di website Apps Script.'
        );
        return;
      }

      if (!window.ZXing || !ZXing.BrowserMultiFormatReader) {
        setStatus(
          'Library scanner belum berhasil dimuat. Periksa koneksi internet lalu muat ulang halaman.'
        );
        return;
      }

      try {
        sending = false;
        scanning = true;

        startButton.disabled = true;
        nextButton.style.display = 'none';

        setStatus('Meminta izin kamera...');

        reader = new ZXing.BrowserMultiFormatReader();

        controls = await reader.decodeFromConstraints(
          {
            video: {
              facingMode: { ideal: 'environment' }
            },
            audio: false
          },
          video,
          (result, error) => {
            if (!scanning || sending || !result) return;

            const qrValue = result.getText();

            if (!qrValue) return;

            sending = true;
            scanning = false;

            stopCamera();

            setStatus('QR berhasil dibaca. Mengirim hasil ke website utama...');

            try {
              window.opener.postMessage(
                {
                  type: 'FROZEN_QR_RESULT',
                  qr: qrValue
                },
                '*'
              );

              setStatus(
                'QR berhasil dikirim. Periksa hasil absensi di website utama.'
              );

              nextButton.style.display = 'block';
            } catch (sendError) {
              setStatus('Gagal mengirim hasil QR ke website utama.');
              nextButton.style.display = 'block';
            }
          }
        );

        setStatus('Kamera aktif. Arahkan kamera ke QR Code siswa.');
      } catch (error) {
        scanning = false;
        stopCamera();

        let message = 'Kamera tidak dapat dibuka.';

        if (error.name === 'NotAllowedError') {
          message = 'Izin kamera ditolak. Izinkan akses kamera pada browser.';
        } else if (error.name === 'NotFoundError') {
          message = 'Kamera tidak ditemukan pada perangkat ini.';
        } else if (error.name === 'NotReadableError') {
          message = 'Kamera sedang digunakan aplikasi lain.';
        }

        setStatus(message);
      } finally {
        startButton.disabled = false;
      }
    }

    startButton.addEventListener('click', startCamera);

    nextButton.addEventListener('click', () => {
      sending = false;
      startCamera();
    });

    closeButton.addEventListener('click', () => {
      stopCamera();
      window.close();

      setStatus('Kamera dihentikan. Kamu dapat menutup tab ini.');
    });

    window.addEventListener('beforeunload', stopCamera);
  </script>
</body>
</html>
