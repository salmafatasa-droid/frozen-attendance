
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07182b">
  <title>Frozen Attendance - QR Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 22px 16px;
      font-family: Arial, sans-serif;
      color: #eaf6ff;
      background:
        radial-gradient(circle at top, #173d60, transparent 55%),
        linear-gradient(145deg, #030914, #07182b 65%, #102c48);
    }

    .container {
      width: 100%;
      max-width: 440px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin: 18px 0 25px;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: auto auto 14px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      font-size: 32px;
      color: #dff5ff;
      background: linear-gradient(145deg, #4d9bc9, #173b61);
      box-shadow: 0 0 25px #5abaff55;
    }

    h1 {
      font-size: 25px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 8px;
      color: #a8c9e5;
      font-size: 13px;
    }

    .scanner-card {
      padding: 17px;
      border: 1px solid #7eb9e355;
      border-radius: 22px;
      background: #102943cc;
      box-shadow: 0 15px 40px #0005;
    }

    .camera-frame {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 17px;
      background: #020914;
      border: 1px solid #78c8ff66;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #9fc5e4;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    .camera-placeholder span {
      font-size: 45px;
    }

    .scan-line {
      display: none;
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 2px;
      background: #b9eaff;
      box-shadow: 0 0 12px #75caff;
      animation: scanning 2s infinite ease-in-out;
    }

    @keyframes scanning {
      0%, 100% { transform: translateY(-75px); }
      50% { transform: translateY(75px); }
    }

    .status {
      margin: 16px 0;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
      color: #c6e7ff;
      background: #1a3c5b;
      line-height: 1.5;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .start {
      color: #06203a;
      background: linear-gradient(135deg, #d9f4ff, #78c8f4);
    }

    .stop {
      color: #eaf6ff;
      background: #294967;
      border: 1px solid #83bde155;
    }

    .result {
      display: none;
      margin-top: 17px;
      padding: 15px;
      border: 1px solid #75b9e355;
      border-radius: 14px;
      background: #0a2036;
      overflow-wrap: anywhere;
    }

    .result h3 {
      margin-bottom: 9px;
      font-size: 15px;
    }

    .result p {
      color: #b8d7ee;
      font-size: 13px;
      line-height: 1.6;
    }

    .back {
      display: block;
      margin: 20px auto 0;
      color: #b9dcf5;
      text-align: center;
      text-decoration: none;
      font-size: 13px;
    }

    .note {
      margin-top: 20px;
      text-align: center;
      color: #789ab7;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="logo">❄</div>
      <h1>FROZEN SCANNER</h1>
      <p class="subtitle">Sistem Presensi Digital SMAN 2 Payakumbuh</p>
    </header>

    <section class="scanner-card">

      <div class="camera-frame">
        <video id="video" muted playsinline></video>

        <div class="camera-placeholder" id="placeholder">
          <span>📷</span>
          <p>Kamera belum diaktifkan.<br>Tekan tombol Mulai Scanner.</p>
        </div>

        <div class="scan-line" id="scanLine"></div>
      </div>

      <div class="status" id="status">
        Scanner siap digunakan.
      </div>

      <div class="buttons">
        <button class="start" id="startButton">
          MULAI SCANNER
        </button>

        <button class="stop" id="stopButton" disabled>
          HENTIKAN
        </button>
      </div>

      <div class="result" id="result">
        <h3>Hasil Pemindaian</h3>
        <p id="resultText"></p>
      </div>

    </section>

    <a class="back" href="index.html">
      ← Kembali ke Halaman Utama
    </a>

    <p class="note">
      FROZEN ATTENDANCE SYSTEM<br>
      SMAN 2 PAYAKUMBUH
    </p>

  </main>

  <script>
    /*
      URL BACKEND AKAN DIISI SETELAH
      GOOGLE APPS SCRIPT SELESAI DI-DEPLOY.
    */
    const API_URL = "";

    const video = document.getElementById("video");
    const statusBox = document.getElementById("status");
    const placeholder = document.getElementById("placeholder");
    const scanLine = document.getElementById("scanLine");
    const resultBox = document.getElementById("result");
    const resultText = document.getElementById("resultText");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    let scanner = null;
    let active = false;
    let processing = false;
    let lastQr = "";
    let lastScanTime = 0;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    async function startScanner() {
      if (!window.ZXingBrowser) {
        setStatus("Library scanner gagal dimuat. Periksa koneksi internet.");
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        setStatus("Browser tidak mendukung kamera atau halaman belum menggunakan HTTPS.");
        return;
      }

      try {
        scanner = new ZXingBrowser.BrowserMultiFormatReader();

        active = true;
        processing = false;

        startButton.disabled = true;
        stopButton.disabled = false;

        placeholder.style.display = "none";
        scanLine.style.display = "block";
        resultBox.style.display = "none";

        setStatus("Meminta izin kamera...");

        await scanner.decodeFromConstraints(
          {
            audio: false,
            video: {
              facingMode: { ideal: "environment" }
            }
          },
          video,
          async (result, error) => {
            if (!active || !result || processing) return;

            const qrValue = result.getText();
            const now = Date.now();

            if (
              qrValue === lastQr &&
              now - lastScanTime < 3000
            ) return;

            lastQr = qrValue;
            lastScanTime = now;
            processing = true;

            await submitAttendance(qrValue);
          }
        );

        setStatus("Kamera aktif. Arahkan kamera ke QR Code siswa.");

      } catch (error) {
        active = false;
        startButton.disabled = false;
        stopButton.disabled = true;

        placeholder.style.display = "flex";
        scanLine.style.display = "none";

        setStatus(
          "Kamera gagal dibuka. Periksa izin kamera browser dan pastikan kamera tidak sedang digunakan aplikasi lain."
        );

        console.error(error);
      }
    }

    async function submitAttendance(qrValue) {
      resultBox.style.display = "block";
      resultText.textContent = "QR terbaca. Memproses absensi...";

      setStatus("Mengirim data pemindaian...");

      if (!API_URL) {
        resultText.textContent =
          "QR berhasil dibaca: " + qrValue +
          ". Backend belum dihubungkan.";

        setStatus("Pemindaian berhasil, tetapi URL backend belum diisi.");
        processing = false;
        return;
      }

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "scan",
            qr: qrValue
          })
        });

        const data = await response.json();

        if (data.ok) {
          resultText.textContent =
            data.message || "Absensi berhasil diproses.";

          setStatus("Pemindaian selesai.");
        } else {
          resultText.textContent =
            data.error || data.message || "Absensi gagal diproses.";

          setStatus("QR terbaca, tetapi absensi belum berhasil.");
        }

      } catch (error) {
        resultText.textContent =
          "Tidak dapat menghubungi server. Periksa koneksi dan konfigurasi backend.";

        setStatus("Terjadi kesalahan saat mengirim data.");
        console.error(error);

      } finally {
        processing = false;
      }
    }

    function stopScanner() {
      active = false;
      processing = false;

      if (scanner) {
        scanner.reset();
        scanner = null;
      }

      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }

      placeholder.style.display = "flex";
      scanLine.style.display = "none";

      startButton.disabled = false;
      stopButton.disabled = true;

      setStatus("Scanner dihentikan.");
    }

    startButton.addEventListener("click", startScanner);
    stopButton.addEventListener("click", stopScanner);

    window.addEventListener("beforeunload", stopScanner);
  </script>

</body>
</html>
